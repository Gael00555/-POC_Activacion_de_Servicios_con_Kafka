# Configuración común a los cinco servicios NestJS: arrancan cuando los topics
# ya están creados (kafka-init terminó) y Mongo ya es primario.
x-app: &app
  restart: unless-stopped
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    mongo:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: activation_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "activation-poc-cluster-01"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: activation_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/create-topics.sh:/create-topics.sh
    entrypoint: ["/bin/sh", "/create-topics.sh"]
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: activation_kafka_ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: activation-poc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: activation_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Sano solo cuando el nodo ya es PRIMARY. Si el replica set todavía no
      # existe, lo inicializa y vuelve a probar en el siguiente intento.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: activation_mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"  # UI web
      - "1025:1025"  # SMTP

  activation-api:
    <<: *app
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        APP: activation-api
    container_name: activation_api
    ports:
      - "3000:3000"
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_CLIENT_ID: activation-api
      KAFKA_GROUP_ID: activation-api
      MONGO_URI: "mongodb://mongo:27017/activation_api?directConnection=true"

  billing-service:
    <<: *app
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        APP: billing-service
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_CLIENT_ID: billing-service
      KAFKA_GROUP_ID: billing-service
      MONGO_URI: "mongodb://mongo:27017/billing_service?directConnection=true"

  provisioning-service:
    <<: *app
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        APP: provisioning-service
    container_name: activation_provisioning
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_CLIENT_ID: provisioning-service
      KAFKA_GROUP_ID: provisioning-service
      MONGO_URI: "mongodb://mongo:27017/provisioning_service?directConnection=true"

  notification-service:
    <<: *app
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        APP: notification-service
    container_name: activation_notification
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_CLIENT_ID: notification-service
      KAFKA_GROUP_ID: notification-service
      MONGO_URI: "mongodb://mongo:27017/notification_service?directConnection=true"
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"

  crm-analytics-service:
    <<: *app
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        APP: crm-analytics-service
    container_name: activation_crm
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_CLIENT_ID: crm-analytics-service
      KAFKA_GROUP_ID: crm-analytics-service
      MONGO_URI: "mongodb://mongo:27017/crm_analytics_service?directConnection=true"
  loyalty-service:
    <<: *app
    profiles: ["loyalty"]
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        APP: loyalty-service
    container_name: activation_loyalty
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_CLIENT_ID: loyalty-service
      KAFKA_GROUP_ID: loyalty-service
      MONGO_URI: "mongodb://mongo:27017/loyalty_service?directConnection=true"
  demo-ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: activation_ui
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - activation-api

volumes:
  kafka_data:
  mongo_data: